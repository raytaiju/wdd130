<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Zhou Ray Yu">
    <meta name="description"
      content="The primary purpose of the Contact & Inquiries Page is to serve as the critical bridge between casual interest and confirmed bookings.">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us THE WHITE WATER RAFTING COMPANY</title>
</head>

<body>

    <header>
        <img src="images/z-raftingbw.png" alt="company logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div>
            <h1></h1>
            <p class="head">White Water Rafting Company.
            <p>
            <p>123 Main River Road<br>Lekki Lagos<br>+234 08 555 555 555<br>whitewater@gmail.com</p>
        </div>
        <div class="table">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d4043.2597110125994!2d3.384626428915745!3d6.66002458526697!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1785682677458!5m2!1sen!2sng"
              width="400" height="507" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>

            <form action="#">
                <div class="poll-item">
                    <label for="name">Name:</label>
                    <input type="text" placeholder="John Thomas" name="name" id="name">
                </div>
                <div class="poll-item">
                    <label for="email">Email:</label>
                    <input type="text" placeholder="johnthomas@gmail.com" name="email" id="email">
                </div>
                <div class="poll-item">
                    <fieldset>
                        <legend>Message purpose</legend>
                        <div class="mainradio">
                            <div class="radio">
                                <input type="radio" id="general" name="purpose" value="general">
                                <label for="general">General Inquiry</label>
                            </div>

                            <div class="radio">
                                <input type="radio" id="reservation" name="purpose"
                                  value="reservation">
                                <label for="reservation">Reservation Question</label>
                            </div>

                            <div class="radio">
                                <input type="radio" id="suggestion" name="purpose"
                                  value="suggestion">
                                <label for="suggestion">Website Suggestion</label>
                            </div>
                        </div>
                    </fieldset>
                </div>
                <div class="poll-item">
                    <label for="message">Message:</label>
                    <textarea name="message" id="message" placeholder="Type here..."></textarea>
                </div>
                <div class="subscribe">
                    <input type="checkbox" name="subscribe-me" id="subscribe-me">
                    <label for="subscribe-me">Please Subscribe me to the monthly news
                        letter</label>
                </div>
                <button type="submit">Get in Touch!</button>
            </form>
        </div>
        <div class="lower">
            <p class="head">We Are Here To Serve You</p>
            <div class="employee-img">
                <figure>
                    <img
                      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR6zTHG7scald87yelf__bdnTAhjnTh9G__MGHmLYYIrEfR8axqA2k9PyU&s=10"
                      alt="employee image" width="200">
                    <figcaption>Emilly Rose</figcaption>
                </figure>
                <figure>
                    <img
                      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTuIYQKO5Tj68pSqWj25-uEKC3uRc8RYZhK-6jpYWRAhw&s=10"
                      alt="employee image" width="200">
                    <figcaption>Garry Paul</figcaption>
                </figure>
                <figure>
                    <img
                      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcThenubt9XJft9zrR6NvA-6vHcTH0eZlvfcRBoRcRWwAg&s=10"
                      alt="employee image" width="200">
                    <figcaption>Precillia Gold</figcaption>
                </figure>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy;2026 RAFTING Ray</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="facebook logo" width="50">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="linkedin logo" width="50">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="instagram logo" width="50">
            </a>
        </nav>
    </footer>

</body>

</html>
