<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll</title>
    <link rel="stylesheet" href="styles/poll.css">
</head>

<body>
    <header>
        <H1>WDD130 <br><span class="main_tittle"> HTML FORM - USER POLL</span>
        </H1>
    </header>

    <main>
        <form action="">
            <fieldset>
                <legend>Contact information:</legend>
                <div class="form-item column2">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <br>
                <div class="form-item column2">
                    <label for="useremail">Email:</label>
                    <input type="text" name="useremail" id="useremail" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Questions:</legend>
                <div class="form-item column1">
                    <label for="browser">What is your favorite browser?</label>
                    <select name="browser" id="browser">
                        <option value="chrome">Chrome</option>
                        <option value="safari">Safari</option>
                        <option value="edge">Edge</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-item column1">
                    <label for="pet">Do you have a household pet?</label>
                    <input type="checkbox" name="pet" id="pet">
                </div>
                <div class="form-item">
                    <label for="feedback" class="lived">List the places you have lived.</label>
                    <textarea name="feedback" id="feedback" rows="4"
                      placeholder="New York..."></textarea>
                </div>
            </fieldset>
            <button type="submit">Submit Poll</button>
        </form>
    </main>

    <footer>
        <p>&copy;2026 | HTML - User Poll Activity | Ray Zhou</p>
    </footer>
</body>

</html>
